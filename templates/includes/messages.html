{% if messages %}
<script>
  document.addEventListener("DOMContentLoaded", function () {
    if (typeof Swal !== "undefined") {
      {% for message in messages %}
        {% if 'modal' in message.tags %}
          Swal.fire({
            icon: '{% if "error" in message.tags or "danger" in message.tags %}error{% elif "warning" in message.tags %}warning{% else %}info{% endif %}',
            title: '{% if "error" in message.tags or "danger" in message.tags %}Attention{% else %}Notification{% endif %}',
            text: "{{ message|escapejs }}",
            confirmButtonText: 'OK',
            customClass: {
              confirmButton: '{% if "error" in message.tags or "danger" in message.tags %}swal2-danger plat-btn-danger{% else %}plat-btn-primary{% endif %}'
            }
          });
        {% else %}
          Swal.fire({
            toast: true,
            position: 'top-end',
            icon: '{% if "success" in message.tags %}success{% elif "error" in message.tags or "danger" in message.tags %}error{% elif "warning" in message.tags %}warning{% else %}info{% endif %}',
            title: "{{ message|escapejs }}",
            showConfirmButton: false,
            timer: 4500,
            timerProgressBar: true,
            backdrop: false,
            customClass: {
              popup: 'plat-swal-toast plat-swal-{% if "success" in message.tags %}success{% elif "error" in message.tags or "danger" in message.tags %}error{% elif "warning" in message.tags %}warning{% else %}info{% endif %}'
            }
          });
        {% endif %}
      {% endfor %}
    }
  });
</script>
<noscript>
  <div class="container mt-3">
    {% for message in messages %}
    <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show shadow-sm" role="alert">
      {{ message }}
    </div>
    {% endfor %}
  </div>
</noscript>
{% endif %}
